[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xsearch-cli"
version = "0.1.0"
description = "A small CLI for searching public X posts with TwitterAPI.io"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
xsearch = "xsearch_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
